# Builds and publishes the image, for linux/amd64 and linux/arm64 as one
# manifest list. The image compiles specpr, Tetracorder and DaVinci from source,
# so it is built here once rather than in every codespace.
#
# arm64 is emulated under qemu, which costs ~50 min against ~7 for a
# native-runner matrix. Traded deliberately for one job instead of two plus a
# digest merge; `git revert` on the commit that introduced this restores the
# matrix if the build frequency changes.
name: container

on:
  # A branch missing here has no image, and the demo derives its tag from the
  # checked-out branch -- so any branch a codespace opens on belongs in this list.
  push:
    branches: [main, build-davinci-multiarch]
    paths-ignore:
      - "SE-Documentation/**"
      - "**/*.md"
      # .dockerignore excludes .devcontainer from the build context, so nothing
      # under it can change the image. The demo's own scripts are mounted at
      # run time, not baked in.
      - ".devcontainer/**"
  # Release publishing, merged in from #40's image.yml so release and branch
  # images come from the same multi-architecture build.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside the automatic ones"
        required: false
        type: string

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tetracorder-lite

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The runner's root filesystem is not big enough for two architectures'
      # layers plus the build tree.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # Only a clean checkout catches this: a published image carries whatever
      # modes the tree that built it had. PR #12 dropped these once.
      - name: Check tetracorder command files are executable
        run: |
          missing=$(find tetracorder/tetracorder -maxdepth 1 -name 'checkmultmap*' ! -perm -u+x)
          if [ -n "$missing" ]; then
            echo "::error::not executable, the container build will fail:"
            echo "$missing"
            exit 1
          fi

      # A missing vendored directory fails minutes into make as
      # "cd: <dir>: No such file or directory". Both iomedley (an svn:external
      # that a targeted export does not follow) and tiff-4.0.3/build (caught by
      # the `build/` rule in .gitignore) have gone missing this way. Only a clean
      # checkout shows it -- a local build reads the working tree instead.
      - name: Vendored DaVinci source is complete
        run: |
          missing=0
          for d in iomedley config libltdl modules lib \
                   iomedley/tiff-4.0.3/build \
                   iomedley/libpng-1.2.3 \
                   iomedley/libjpeg; do
            if [ ! -d "vendor/davinci/src/$d" ]; then
              echo "::error::vendor/davinci/src/$d is missing -- see vendor/davinci/VENDOR.md"
              git check-ignore -v "vendor/davinci/src/$d" || echo "  (not ignored -- never exported)"
              missing=1
            fi
          done
          test -f vendor/davinci/src/configure || { echo "::error::configure missing"; missing=1; }
          [ "$missing" -eq 0 ] && echo "vendored DaVinci source looks complete"
          exit $missing

      # Required for the emulated arm64 half: without the binfmt handlers the
      # build fails with "exec format error" on its first RUN.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every branch publishes under its own name, which is what the demo
      # resolves from the branch it checked out.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # Tag-only, so these yield nothing on a branch push. :latest is
            # deliberately absent: flavor's default latest=auto adds it for
            # stable semver only, where an explicit entry would hand it to a
            # prerelease.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Both platforms in one call, so buildx pushes a manifest list under the
      # tags directly -- no pushing by digest and no merge step to assemble it.
      #
      # This also attaches a SLSA build-provenance attestation per architecture,
      # which is the default and is kept deliberately. It records the commit
      # (vcs:revision), the Actions run that built the image, and the base image
      # by digest -- so "which commit produced this image" is answerable from the
      # registry alone. That matters more than usual here, because the image
      # compiles DaVinci, specpr and Tetracorder from source.
      #
      # The cost is cosmetic: each attestation rides in the manifest list as an
      # entry with platform "unknown/unknown", and GHCR's package page renders
      # that literally rather than labelling it an attestation. It is not a
      # broken or empty image, and docker ignores those entries when selecting a
      # platform. To check which image an entry belongs to:
      #
      #   docker buildx imagetools inspect <ref> --raw | \
      #     jq '.manifests[] | {platform, annotations}'
      #
      # -- the annotation vnd.docker.reference.digest names the real image it
      # attests to. Add `provenance: false` below to drop them entirely.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Checks what was published against the promise, so an edit to `platforms`
      # fails here rather than on someone's Mac. Uses meta.outputs.version, not
      # github.ref_name: on a release the ref is v1.1.0 but the published tag is
      # 1.1.0, and inspecting :v1.1.0 would fail every release.
      - name: Both architectures are in the published manifest
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}" --raw \
            | jq -r '.manifests[] | select(.platform.architecture != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' \
            | sort | tee /tmp/arches
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" /tmp/arches || { echo "::error::$want missing from the manifest"; exit 1; }
          done
          echo "manifest carries both architectures"
