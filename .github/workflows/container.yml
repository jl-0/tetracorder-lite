# Builds the image the Codespaces demo pulls.
#
# The build compiles specpr, Tetracorder and DaVinci from source, which is far
# too slow to do inside a codespace on every create. Doing it here once per push
# means a codespace only has to pull.
#
# Published for linux/amd64 and linux/arm64. Each architecture is built on a
# native runner and pushed by digest; a final job joins the two digests into one
# manifest list, so `docker pull` on either architecture gets the right image
# without emulation. Emulating a build this size under qemu takes hours -- the
# matrix exists to avoid that, not for tidiness.
name: container

on:
  # main is here so the image a codespace opened on main would pull actually
  # exists: the demo scripts derive their tag from the checked-out branch, and a
  # branch absent from this list has no image at all.
  push:
    branches: [main, build-davinci-multiarch]
    paths-ignore:
      - "SE-Documentation/**"
      - "**/*.md"
      # .dockerignore excludes .devcontainer from the build context, so nothing
      # under it can change the image. The demo's own scripts are mounted at
      # run time, not baked in.
      - ".devcontainer/**"
  # Release publishing, merged in from the separate image.yml added by #40.
  # Keeping them apart would have meant release images built by a single-runner
  # job -- amd64 only -- while branch images were multi-architecture, so the
  # tags people actually pull (:latest, the semver ones) would be the ones
  # missing arm64. One workflow, one manifest-list builder, all tags.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside the automatic ones"
        required: false
        type: string

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tetracorder-lite

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # GitHub-hosted arm64 runners are free for public repositories.
            # Without a native runner this job emulates gcc under qemu for
            # three source builds, which is the difference between minutes and
            # hours.
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The build tree is large and the runner's root filesystem is not. Reclaim
      # the preinstalled toolchains nothing here uses before starting.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # A clean checkout is the only place the exec-bit and DATASETS classes of
      # regression show up -- a published image carries the artefacts of
      # whatever tree built it. Fail here rather than in someone's codespace.
      - name: Check tetracorder command files are executable
        run: |
          missing=$(find tetracorder/tetracorder -maxdepth 1 -name 'checkmultmap*' ! -perm -u+x)
          if [ -n "$missing" ]; then
            echo "::error::not executable, the container build will fail:"
            echo "$missing"
            exit 1
          fi

      # The vendored DaVinci tree is what makes the arm64 image possible at all,
      # and an svn export that silently dropped a directory is exactly the kind
      # of thing that only shows up as a link error twenty minutes in. iomedley
      # is an svn:external, so it is the one most likely to go missing.
      # Checks run against the git checkout, not a working tree, because that is
      # the only place this class of bug appears: `docker build` reads the build
      # context, which .gitignore does not filter, so a local build passes while
      # a clean checkout is missing files. Both entries below have already been
      # caught this way once -- iomedley (an svn:external a targeted export does
      # not follow) and tiff-4.0.3/build (swallowed by the `build/` rule in
      # .gitignore). Each is named in a SUBDIRS line, so each fails as
      # "cd: <dir>: No such file or directory" minutes into make.
      - name: Vendored DaVinci source is complete
        run: |
          missing=0
          for d in iomedley config libltdl modules lib \
                   iomedley/tiff-4.0.3/build \
                   iomedley/libpng-1.2.3 \
                   iomedley/libjpeg; do
            if [ ! -d "vendor/davinci/src/$d" ]; then
              echo "::error::vendor/davinci/src/$d is missing -- see vendor/davinci/VENDOR.md"
              git check-ignore -v "vendor/davinci/src/$d" || echo "  (not ignored -- never exported)"
              missing=1
            fi
          done
          test -f vendor/davinci/src/configure || { echo "::error::configure missing"; missing=1; }
          [ "$missing" -eq 0 ] && echo "vendored DaVinci source looks complete"
          exit $missing

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest with no tag: a tag can only point at one thing, so
      # letting both jobs tag :demo would leave whichever finished last as the
      # whole image and discard the other architecture. The merge job below is
      # what attaches the tags, to a manifest list naming both digests.
      #
      # This also attaches a SLSA build-provenance attestation per architecture,
      # which is the default and is kept deliberately. It records the commit
      # (vcs:revision), the Actions run that built the image, and the base image
      # by digest -- so "which commit produced this image" is answerable from the
      # registry alone. That matters more than usual here, because the image
      # compiles DaVinci, specpr and Tetracorder from source.
      #
      # The cost is cosmetic: each attestation rides in the manifest list as an
      # entry with platform "unknown/unknown", and GHCR's package page renders
      # that literally rather than labelling it an attestation. It is not a
      # broken or empty image, and docker ignores those entries when selecting a
      # platform. To check which image an entry belongs to:
      #
      #   docker buildx imagetools inspect <ref> --raw | \
      #     jq '.manifests[] | {platform, annotations}'
      #
      # -- the annotation vnd.docker.reference.digest names the real image it
      # attests to. Add `provenance: false` below to drop them entirely.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # One file per architecture, named after its digest, so the merge job can
      # collect them without needing to know how many there were.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          # The sha256: prefix is stripped because the merge job re-adds it when
          # it builds IMAGE@sha256:<digest>. Leaving it on produces
          # IMAGE@sha256:sha256:... and a filename containing a colon, which
          # upload-artifact rejects.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.platform }} -> $digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ runner.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture digests into one tagged manifest list. This is
  # the job that makes `docker pull ...:demo` work on an Apple Silicon Mac
  # without --platform, which it never did before.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every branch publishes under its own name and nothing else, so image
      # work on one branch cannot disturb another. The demo resolves the same
      # name from the branch it checked out, so a codespace opened on a branch
      # runs that branch's image with nothing to configure; TETRACORDER_IMAGE
      # overrides it to point somewhere else.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # From image.yml. These read the git tag, so they yield nothing on a
            # branch push and need no gate: procSemver in metadata-action bails
            # unless the ref matches ^refs/tags/. A release event's ref is
            # refs/tags/vX.Y.Z, so they fire there.
            #
            # :latest is NOT listed. flavor's default latest=auto already adds it
            # for type=semver, and only for a stable version -- image.yml's
            # explicit type=raw,value=latest would have moved :latest onto a
            # prerelease, so publishing v1.2.0-rc1 would have made the release
            # candidate the default pull. auto also collapses a prerelease to
            # {{version}} alone, so an rc never claims the bare :1 or :1.1
            # either. latest=auto never applies to type=ref,event=branch, so no
            # branch push can take it.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # Proves the manifest list actually carries both, rather than trusting that
      # `imagetools create` did what was asked. A single-architecture manifest
      # published under a multi-architecture promise is the exact failure this
      # whole branch exists to fix, so it is worth one assertion.
      # Inspected by steps.meta.outputs.version rather than github.ref_name: on a
      # release those differ. ref_name is the git tag (v1.1.0), but metadata-action
      # strips the v, so what actually got published is 1.1.0 -- inspecting
      # :v1.1.0 would look for a tag this workflow never writes and fail every
      # release. `version` is the primary generated tag, which is the branch name
      # on a branch push and the semver on a release, so it is right for both.
      - name: Both architectures are in the published manifest
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}" --raw \
            | jq -r '.manifests[] | select(.platform.architecture != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' \
            | sort | tee /tmp/arches
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" /tmp/arches || { echo "::error::$want missing from the manifest"; exit 1; }
          done
          echo "manifest carries both architectures"
