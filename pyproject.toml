[project]
name = "tetrapy"
version = "1.1.0"
description = "Containerized USGS Tetracorder (v6) for EMIT mineral identification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-box[all]>=7.4.1",
    # Both are imported directly by tetrapy -- rasterio at import time in
    # __init__.py, yaml in __main__.py -- but were reaching the environment only
    # as transitive dependencies of rioxarray and python-box. Declared so a
    # change in either of those cannot take them away.
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "rich>=13.0.0",
    "rioxarray>=0.19.0",
    "scipy>=1.15.3",
    "spectral>=0.25",
    "xarray>=2025.6.1",
]

[project.optional-dependencies]
# For .devcontainer/tools/: quicklook.py and make_context_image.py render the
# mineral maps and the context figure for the demo's results page, and run
# inside the container against a mounted /tools. matplotlib was supplied by
# [tool.pixi.dependencies] until #40 removed pixi, and it was never in [project]
# dependencies -- so it left with pixi and the results page stopped rendering
# with "No module named 'matplotlib'". The Containerfile's `uv sync --all-extras`
# is what carries this into the image.
#
# pillow is optional to quicklook.py by design (it degrades to skipping the
# colour-panel coverage ranking), but the demo wants that ranking, and it is
# already present transitively -- naming it just makes that guaranteed.
demo = [
  "matplotlib>=3.8",
  "pillow>=10.0",
]
docs = [
  "mike>=2.1.3",
  "mkapi>=4.5.0",
  "mkdocs>=1.6.1,<2",
  "mkdocs-material[imaging]>=9.7.1",
]

[project.scripts]
tetrapy = "tetrapy.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
